core:
  - module: "IT-Security 1 - Cryptographic Basics and Network Security"
    module_id: "1211901"
    ects: 6.0
    area: hw_sw_systems
    reason: "Cryptographic fundamentals (symmetric/asymmetric encryption, integrity protection) and network security basics -- the foundational security knowledge every other module in this track builds on."
  - module: "IT-Security 2 - Computer Security"
    module_id: "1211900"
    ects: 6.0
    area: hw_sw_systems
    reason: "System and computer security, building directly on IT-Security 1's cryptographic basics per the module's own stated recommended background."
  - module: "Advanced Network Security"
    module_id: "1230527"
    ects: 6.0
    area: hw_sw_systems
    reason: "Cryptographic protocols and security architectures for wireless and wired networks -- the natural depth follow-on to the network-security foundation IT-Security 1/2 establish."

complementary:
  - module: "Industrial Network Security"
    module_id: "1227956"
    ects: 6.0
    area: hw_sw_systems
    reason: "Security problems and solutions specific to industrial/OT networks, extending the core security foundation into a distinct, growing specialization."
  - module: "Industrial Data Security"
    module_id: "1231539"
    ects: 6.0
    area: ai_data
    reason: "Security problems specific to industrial data pipelines -- its own recommended background explicitly combines IT security, databases, and machine learning."
  - module: "Communication Systems Engineering"
    module_id: "1212349"
    ects: 6.0
    area: hw_sw_systems
    reason: "Protocol design and implementation -- the networking basis the track's own draft calls for before specializing into network security."

nice_to_have:
  - module: "Software Architecture"
    module_id: "1235068"
    ects: 6.0
    area: software_methods_tools
    reason: "Large-systems design skill useful for reasoning about a system's attack surface holistically, though not this track's main focus."
  - module: "Static Program Analysis"
    module_id: "1212330"
    ects: 6.0
    area: theoretical_cs
    reason: "Data-flow analysis and abstract interpretation -- directly useful for vulnerability discovery and secure-code review, the software-side complement to this track's network/systems security core."

# Hands-on security tooling, not taught by any MSInf elective. Evidence:
# live O*NET OnLine page for 15-1212.00 "Information Security Analysts"
# (CC BY 4.0, see data/onet/ATTRIBUTION.md), filtered to Hot
# Technology/In Demand items that are security-specific rather than
# generic IT tools already covered in software_engineering.yaml.
practical_skills:
  - skill: firewall_administration
    why: "Operating and tuning firewalls is standard security-engineering practice, but IT-Security 1/2 and the Network Security modules teach the protocols and threat models, not hands-on firewall configuration and rule management."
    evidence: "\"Firewall software\" is the single highest-ranked In Demand skill listed for Information Security Analysts, appearing in 18% of 2025 US job postings (O*NET 15-1212.00, Lightcast data)."
    learn_more_url: "https://www.onetonline.org/link/demand/15-1212.00"
  - skill: siem_and_security_monitoring
    why: "Real-time log analysis and alerting (SIEM) is how incidents actually get detected in practice -- no MSInf module teaches hands-on SIEM operation."
    evidence: "Splunk Enterprise is rated both Hot Technology and In Demand for Information Security Analysts, appearing in 12% of 2025 US job postings (O*NET 15-1212.00)."
    learn_more_url: "https://www.onetonline.org/link/summary/15-1212.00"
  - skill: threat_intelligence_frameworks
    why: "Structuring real-world attacker tactics and techniques, not just abstract threat models, is a practical SOC/threat-hunting skill this track's theoretical coursework doesn't cover."
    evidence: "MITRE ATT&CK software is rated In Demand for Information Security Analysts, appearing in 7% of 2025 US job postings (O*NET 15-1212.00)."
    learn_more_url: "https://www.onetonline.org/link/demand/15-1212.00"
  - skill: vulnerability_scanning
    why: "Static Program Analysis teaches code-level analysis theory, but scanning live networks and infrastructure for known vulnerabilities is a separate, practical tooling skill."
    evidence: "Tenable Nessus is rated In Demand for Information Security Analysts, appearing in 5% of 2025 US job postings (O*NET 15-1212.00)."
    learn_more_url: "https://www.onetonline.org/link/demand/15-1212.00"
  - skill: identity_and_access_management
    why: "Administering directory services and access control -- who can reach what -- is standard enterprise security practice that none of this track's modules teach hands-on."
    evidence: "Microsoft Active Directory appears in 4% of 2025 US job postings and is rated Hot Technology for Information Security Analysts (O*NET 15-1212.00)."
    learn_more_url: "https://www.onetonline.org/link/summary/15-1212.00"
