# Two distinct real modules share a near-identical name; this track
# means the singular "Software Architecture" (id 1235068), not
# "Architectures".

track_id: software_engineering
title: Software engineer

skills_weighted:
  - skill: software_design
    weight: 5
    evidence: "13 of 13 postings explicitly ask for system/software design ability (architecture, design patterns, distributed-systems design)"
  - skill: programming_language_concepts
    weight: 1
    evidence: "3 of 13 postings explicitly ask for CS fundamentals, data structures & algorithms, or a named language paradigm/type system -- a bare list of languages (e.g. \"Go, Python, Rust or similar\") was counted as a tooling/stack signal, not this skill"
  - skill: program_analysis_and_verification
    weight: 5
    evidence: "12 of 13 postings explicitly ask for code review, testing, debugging, or static-analysis practice"

skills_weighted_methodology: >
  weight = round((count / 13) * 5), a 1-5 scale, never below 1. Each of the 13
  postings was fetched individually and checked against all 3 skills with the
  same definitions (see studyrag-decisions-log.md for the per-posting table);
  no posting was counted from a search snippet alone, and 1 candidate posting
  was excluded for being unverifiable (JS-rendered, no real content retrievable)
  rather than guessed. software_design came back a near-ceiling signal (13/13)
  -- most senior software/backend postings today use some system-design
  language, so it's a less discriminating count than the other two skills.
  programming_language_concepts was counted strictly on purpose: this skill
  means language-level conceptual fluency (what Foundations of Functional
  Programming / Software Language Engineering / Compiler Construction
  actually teach), not "knows several languages" -- counted inclusively
  (any multi-language mention at all), the figure would be roughly 9-10 of 13
  instead of 3 of 13. Sample skews toward infrastructure/platform companies
  (Twilio, Grafana Labs, GitLab) -- a real limitation of this one pass, not
  claimed as a representative cross-industry survey.
skills_weighted_sources:
  - {company: Twilio, title: "Senior Software Engineer", url: "https://job-boards.greenhouse.io/twilio/jobs/8015771"}
  - {company: Twilio, title: "Software Engineer L3 (Email Platform)", url: "https://job-boards.greenhouse.io/twilio/jobs/8009057"}
  - {company: Twilio, title: "Staff Software Engineer", url: "https://job-boards.greenhouse.io/twilio/jobs/7944328"}
  - {company: Twilio, title: "Software Engineer (Observability)", url: "https://job-boards.greenhouse.io/twilio/jobs/8108771"}
  - {company: Twilio, title: "Staff Software Engineer, Fraud", url: "https://job-boards.greenhouse.io/twilio/jobs/7595407"}
  - {company: "Grafana Labs", title: "Senior Software Engineer - Session Replay", url: "https://job-boards.greenhouse.io/grafanalabs/jobs/6208010004"}
  - {company: "Grafana Labs", title: "Staff Software/Backend Engineer - Adaptive Telemetry", url: "https://job-boards.greenhouse.io/grafanalabs/jobs/6108384004"}
  - {company: "Grafana Labs", title: "Staff Backend Engineer - Grafana Alerting", url: "https://job-boards.greenhouse.io/grafanalabs/jobs/6105872004"}
  - {company: GitLab, title: "Senior Backend Engineer, Core DevOps", url: "https://job-boards.greenhouse.io/gitlab/jobs/8689243002"}
  - {company: GitLab, title: "Intermediate Backend Engineer, AMER", url: "https://job-boards.greenhouse.io/gitlab/jobs/8773006002"}
  - {company: GitLab, title: "Senior Backend Engineer (Go), Tenant Scale: Gitaly", url: "https://job-boards.greenhouse.io/gitlab/jobs/8749951002"}
  - {company: GitLab, title: "Senior Backend Engineer, AI Engineering: Chat", url: "https://job-boards.greenhouse.io/gitlab/jobs/8621733002"}
