core:
  - module: "Foundations of Functional Programming"
    module_id: "1215684"
    ects: 6.0
    area: theoretical_cs
    reason: "Functional programming (Haskell, higher-order functions, lazy evaluation, monads) is foundational for language-level software engineering work and underlies modern language design."
  - module: "Software Language Engineering"
    module_id: "1216957"
    ects: 6.0
    area: software_methods_tools
    reason: "Core language-definition concepts (meta-models, grammars, modern editors) directly needed for building and evolving software tooling and DSLs."
  - module: "Software Architecture"
    module_id: "1235068"
    ects: 6.0
    area: software_methods_tools
    reason: "Architectural decision-making, recording, and trade-off analysis from multiple viewpoints — the central large-systems-design skill for a software engineer."

complementary:
  - module: "Static Program Analysis"
    module_id: "1212330"
    ects: 6.0
    area: theoretical_cs
    reason: "Data-flow analysis and abstract interpretation deepen the program-analysis/verification side of software quality, supporting the core architecture and language work."
  - module: "Compiler Construction"
    module_id: "1211978"
    ects: 6.0
    area: theoretical_cs
    reason: "Lexical/syntactic/semantic analysis and compiler tooling (lex, yacc) is a natural follow-up to Software Language Engineering's language-definition focus."

nice_to_have:
  - module: "Communication Systems Engineering"
    module_id: "1212349"
    ects: 6.0
    area: hw_sw_systems
    reason: "Protocol design and implementation knowledge is useful breadth for a software engineer but not core to the track's main skills."

# Not taught by any MSInf elective — modules teach the underlying concepts
# (software design, distributed systems, databases) but not the specific
# industry tooling a working software engineer uses daily. Evidence:
# data/onet/technology_skills_software_developers.csv (O*NET 15-1252.00
# "Software Developers", CC BY 4.0 — see data/onet/ATTRIBUTION.md),
# filtered to technologies flagged both Hot Technology and In Demand,
# then grouped into coherent skill areas with original wording (not
# O*NET's own text, per their license terms). Programming languages from
# the same evidence (Python, Java, C++, Go, JavaScript/TypeScript, SQL)
# are deliberately excluded here — a CS degree already teaches
# programming languages directly, so they're not a coverage gap the way
# these tools are.
practical_skills:
  - skill: version_control
    why: "Nearly universal in real software engineering practice, but MSInf coursework doesn't teach Git/GitHub workflows directly — branching, code review via pull requests, resolving merge conflicts."
    evidence: "Git and GitHub both rated Hot Technology + In Demand for Software Developers (O*NET 15-1252.00)."
    learn_more_url: "https://www.onetonline.org/link/tt/15-1252.00"
  - skill: containerization_and_orchestration
    why: "Packaging and deploying software reliably (Docker, Kubernetes) is standard industry practice that no MSInf module teaches as a practical skill — Software Architecture covers the design theory, not the deployment tooling."
    evidence: "Docker and Kubernetes both rated Hot Technology + In Demand for Software Developers (O*NET 15-1252.00)."
    learn_more_url: "https://www.onetonline.org/link/tt/15-1252.00"
  - skill: ci_cd_and_infrastructure_automation
    why: "Automating builds, tests, and deployments (e.g. Jenkins, Terraform) is a practical engineering skill with no dedicated MSInf module."
    evidence: "Jenkins CI and (IBM) Terraform both rated Hot Technology + In Demand for Software Developers (O*NET 15-1252.00)."
    learn_more_url: "https://www.onetonline.org/link/tt/15-1252.00"
  - skill: cloud_platforms
    why: "Most real-world software engineering now runs on a cloud platform (AWS, Azure) — operational knowledge MSInf coursework doesn't cover."
    evidence: "Amazon Web Services and Microsoft Azure software both rated Hot Technology + In Demand for Software Developers (O*NET 15-1252.00)."
    learn_more_url: "https://www.onetonline.org/link/tt/15-1252.00"
  - skill: team_collaboration_tooling
    why: "Tracking work and coordinating with a team (e.g. JIRA) is an everyday practical skill, distinct from the technical content any module teaches."
    evidence: "Atlassian JIRA rated Hot Technology + In Demand for Software Developers (O*NET 15-1252.00)."
    learn_more_url: "https://www.onetonline.org/link/tt/15-1252.00"
