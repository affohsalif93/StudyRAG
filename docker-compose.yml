services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Data stays on the host, not baked into the image: it's
      # gitignored and regenerable, and mounting it means rebuilding the
      # data doesn't require rebuilding the image. Read-write, not
      # read-only -- the chair-lookup agent's long-term memory
      # (data/user_memory.db) is written at runtime.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy

  # The elective recommender's prerequisite graph (~265 modules, a few
  # hundred edges) -- small, but Neo4j is used deliberately rather than
  # a SQLite table, see studyrag-decisions-log.md.
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474" # browser UI
      - "7687:7687" # bolt (driver connections)
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-studyrag_dev_password}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  neo4j_data:
