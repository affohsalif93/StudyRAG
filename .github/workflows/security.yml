name: Security

# Red-team / prompt-injection suite. Weekly + manual, not on every push
# -- each run makes real OpenAI calls (eval/test_injection.py's 9 cases),
# so it isn't free, and the system prompt it's defending doesn't change
# often enough to need checking on every commit.
on:
  schedule:
    - cron: "0 7 * * 1" # Mondays, 07:00 UTC
  workflow_dispatch: {} # manual trigger from the Actions tab

jobs:
  prompt-injection:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run prompt-injection suite
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY not set — skipping (this suite needs real LLM calls)."
            exit 0
          fi
          uv run python -m eval.test_injection
